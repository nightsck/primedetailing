<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>KI-Vertrieb</title>
<style>
:root{--paper:#F4F2EE;--sheet:#FFFFFF;--ink:#1B1D1F;--ink-2:#4A4E52;--muted:#6B6F73;--line:#D9D5CE;--signal:#F2C200;--ok:#2E6B45;--wait:#8A5A00;--bad:#A8322A;--on-signal:#1B1D1F;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--paper:#151617;--sheet:#1E2022;--ink:#ECEAE6;--ink-2:#B9B6B0;--muted:#8E9196;--line:#33363A;--ok:#7CC79A;--wait:#E6B85C;--bad:#F08A80;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
a{color:inherit}
h1,h2,h3{line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.num,td.betrag,.betrag{font-variant-numeric:tabular-nums}
header{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.top{max-width:1200px;margin:0 auto;padding:10px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.mark{font-weight:700;white-space:nowrap}.mark span{background:var(--signal);color:var(--on-signal);padding:0 4px;margin-left:4px;font-size:13px}
nav{display:flex;gap:2px;overflow-x:auto;flex:1;scrollbar-width:none}
nav a{padding:6px 10px;text-decoration:none;color:var(--ink-2);white-space:nowrap;border-bottom:3px solid transparent;font-size:15px}
nav a[aria-current=page]{color:var(--ink);border-bottom-color:var(--signal)}
main{max-width:1200px;margin:0 auto;padding:24px 16px 64px}
.zeile{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.zwischen{justify-content:space-between}
.stapel>*+*{margin-top:16px}
.blatt{background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:16px}
.leise{color:var(--muted);font-size:13px}
.zweit{color:var(--ink-2)}
.fehler{color:var(--bad)}
button,.knopf{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--sheet);color:var(--ink);padding:8px 14px;border-radius:4px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;min-height:40px}
button.haupt,.knopf.haupt{background:var(--ink);color:var(--paper);border-color:var(--ink)}
button.gefahr{color:var(--bad)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--signal);outline-offset:1px}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-height:40px}
textarea{min-height:90px;resize:vertical}
label{display:block;font-size:13px;color:var(--ink-2)}
label>input,label>select,label>textarea{margin-top:4px}
.felder{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.felder .breit{grid-column:1/-1}
.check{display:flex;gap:8px;align-items:flex-start;font-size:15px;color:var(--ink)}
.check input{width:auto;min-height:0;margin-top:4px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;color:var(--muted);font-weight:600;padding:8px 8px 6px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr.klick{cursor:pointer}tr.klick:hover td{background:color-mix(in srgb,var(--signal) 8%,transparent)}
.tabelle{overflow-x:auto}
.marke{display:inline-block;font-size:13px;padding:1px 6px;border:1px solid var(--line);border-radius:4px;white-space:nowrap}
.marke.ok{color:var(--ok);border-color:currentColor}.marke.wait{color:var(--wait);border-color:currentColor}.marke.bad{color:var(--bad);border-color:currentColor}
.score{font-weight:700;font-variant-numeric:tabular-nums}
.score.hoch{background:var(--signal);color:var(--on-signal);padding:0 4px}
.zahlen{display:flex;gap:32px;flex-wrap:wrap}
.zahlen div b{display:block;font-size:28px;line-height:1.1}
.zahlen div span{font-size:13px;color:var(--muted)}
.spalten{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.spalte h3{font-size:15px;padding-bottom:6px;border-bottom:3px solid var(--line);margin-bottom:8px}
.spalte h3 .leise{font-weight:400}
.karte{display:block;background:var(--sheet);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:8px;text-decoration:none;font-size:15px}
.karte:hover{border-color:var(--ink-2)}
.raster{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px}
@media (max-width:860px){.raster{grid-template-columns:1fr}}
.verlauf li{list-style:none;padding:8px 0;border-bottom:1px solid var(--line)}
.verlauf{padding:0;margin:0}
.radios{display:flex;flex-wrap:wrap;gap:8px}
.radios label{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:4px;padding:6px 10px;font-size:15px;color:var(--ink);cursor:pointer}
.radios input{width:auto;min-height:0}
.radios label:has(input:checked){border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--signal)}
.hinweis{border-left:3px solid var(--signal);padding:8px 12px;background:var(--sheet)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:4px;box-shadow:0 6px 24px rgba(0,0,0,.25);display:none;max-width:calc(100% - 32px);z-index:20}
.versteckt{display:none!important}
details summary{cursor:pointer;font-weight:600}
.stern{border:0;background:none;min-height:32px;padding:0 4px;font-size:20px;line-height:1;color:var(--line);cursor:pointer}
.stern[aria-pressed=true]{color:var(--signal);text-shadow:0 0 0 var(--ink)}
.stern:hover{color:var(--ink-2)}
.aufgaben{list-style:none;padding:0;margin:0}
.aufgaben li{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.aufgaben li .was{flex:1;min-width:200px}
.aufgaben li .tun{display:flex;gap:6px;flex-wrap:wrap}
.aufgaben li.ueber{box-shadow:inset 3px 0 0 var(--bad);padding-left:8px}
.aufgaben li.wichtig{box-shadow:inset 3px 0 0 var(--signal);padding-left:8px}
button.klein,.knopf.klein{min-height:32px;padding:4px 10px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:4px;background:var(--sheet);color:var(--ink);padding:16px;max-width:min(440px,calc(100% - 32px));width:100%}
dialog::backdrop{background:rgba(0,0,0,.35)}
.check-liste{display:flex;flex-direction:column;gap:6px}
.lz{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));border-bottom:1px solid var(--line);padding-bottom:12px}
.vkarte{border:1px solid var(--line);border-radius:4px;padding:12px}
.vkarte+.vkarte{margin-top:12px}
.leitfaden{white-space:pre-wrap;margin:4px 0 0}
.balken{display:inline-block;height:10px;background:var(--signal);vertical-align:middle;margin-left:6px}
.quali{display:grid;gap:8px}
.quali .radios label{padding:4px 8px;font-size:14px}
fieldset.ohne{border:0;padding:0;margin:0}
fieldset.ohne legend{font-size:13px;color:var(--ink-2);margin-bottom:4px}
@media (max-width:600px){main{padding-top:16px}h1{font-size:22px}.zahlen{gap:20px}}
</style>
</head>
<body>
<header><div class="top"><span class="mark">KI-Vertrieb<span>CRM</span></span>
<nav id="nav" aria-label="Bereiche">
<a href="#/heute">Heute</a><a href="#/pipeline">Pipeline</a><a href="#/firmen">Firmen</a><a href="#/angebote">Angebote</a><a href="#/vertraege">Verträge</a><a href="#/zahlungen">Zahlungen</a><a href="#/bericht">Bericht</a><a href="#/produkte">Produkte</a><a href="#/leitfaeden">Leitfäden</a><a href="#/einstellungen">Einstellungen</a>
</nav><button id="abmelden" type="button" class="versteckt">Abmelden</button></div></header>
<main id="app" aria-live="polite"><p class="leise">Lädt …</p></main>
<div id="toast" role="status"></div>
<dialog id="wv" aria-labelledby="wvTitel"><form id="wvForm" class="stapel" method="dialog">
  <h2 id="wvTitel">Wiedervorlage</h2><p id="wvWas" class="zweit" style="margin:0"></p>
  <div class="chips" id="wvChips"></div>
  <label>Neues Datum<input type="date" name="faellig" required></label>
  <label>Grund (optional)<input name="grund" placeholder="z. B. Chef erst ab Montag da"></label>
  <label>Für<select name="zustaendig"></select></label>
  <div class="zeile"><button class="haupt" type="submit" value="ok">Speichern</button><button type="button" id="wvAbbrechen">Abbrechen</button></div>
</form></dialog>
<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const eur = (ct) => ((Number(ct) || 0) / 100).toLocaleString("de-DE", { style: "currency", currency: "EUR" });
const eurFeld = (ct) => ((Number(ct) || 0) / 100).toFixed(2).replace(".", ",");
const datum = (t) => { if (!t) return ""; const d = typeof t === "number" ? new Date(t) : new Date(t + "T12:00:00"); return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" }); };
const zeit = (ms) => new Date(ms).toLocaleString("de-DE", { day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
const heute = () => new Date().toLocaleDateString("sv-SE");
let ICH = null;
const STATUS = () => (ICH && ICH.status) || {};

function toast(t) { const el = $("#toast"); el.textContent = t; el.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => (el.style.display = "none"), 3500); }
async function api(methode, pfad, daten, extra) {
  const o = { method: methode, headers: { "x-crm": "1" }, credentials: "same-origin" };
  if (daten instanceof Blob) { o.body = daten; Object.assign(o.headers, extra || {}); }
  else if (daten !== undefined) { o.body = JSON.stringify(daten); o.headers["Content-Type"] = "application/json"; }
  const r = await fetch("/api/crm" + pfad, o);
  const j = await r.json().catch(() => ({ ok: false, fehler: "Keine Antwort vom Server." }));
  if (r.status === 401 && j.anmelden) { zeigeLogin(); throw new Error("abgemeldet"); }
  if (!j.ok) throw new Error(j.fehler || "Das hat nicht geklappt.");
  return j;
}
function formDaten(form) { const d = {}; for (const el of form.elements) { if (!el.name) continue; if (el.type === "checkbox") d[el.name] = el.checked; else if (el.type === "radio") { if (el.checked) d[el.name] = el.value; } else d[el.name] = el.value; } return d; }
function beiAbsenden(form, f) {
  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const b = form.querySelector("button[type=submit]"); if (b) b.disabled = true;
    try { await f(formDaten(form), form); } catch (err) { if (err.message !== "abgemeldet") toast(err.message); } finally { if (b) b.disabled = false; }
  });
}
const marke = (s) => { const t = STATUS()[s] || s; const k = s === "kunde" ? "ok" : s === "anruf_impuls" || s === "termin" || s === "angebot" ? "wait" : s === "kein_interesse" ? "bad" : ""; return `<span class="marke ${k}">${esc(t)}</span>`; };
const scoreHtml = (s) => s == null ? `<span class="leise">–</span>` : `<span class="score ${s >= 70 ? "hoch" : ""}">${s}</span>`;
const telLink = (t) => t ? `<a href="tel:${esc(String(t).replace(/[^\d+]/g, ""))}">${esc(t)}</a>` : `<span class="leise">keine Nummer</span>`;

/* ---------- Anmeldung ---------- */
function zeigeLogin() {
  $("#nav").classList.add("versteckt"); $("#abmelden").classList.add("versteckt");
  $("#app").innerHTML = `<div class="blatt" style="max-width:440px;margin:48px auto"><h1>Anmelden</h1>
    <p class="zweit">Sie bekommen einen Anmelde-Link per E-Mail. Er ist 20 Minuten gültig.</p>
    <form id="login" class="stapel"><label>E-Mail-Adresse<input name="email" type="email" autocomplete="email" required></label>
    <button class="haupt" type="submit">Link schicken</button></form><p id="loginInfo" class="zweit"></p></div>`;
  beiAbsenden($("#login"), async (d) => {
    const r = await fetch("/api/crm/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) });
    if (!r.ok) throw new Error("Das hat nicht geklappt.");
    $("#loginInfo").textContent = "Wenn die Adresse freigeschaltet ist, ist der Link unterwegs. Bitte im Postfach nachsehen (auch im Spam-Ordner).";
  });
}
$("#abmelden").addEventListener("click", async () => { await fetch("/api/crm/abmelden", { method: "POST" }); ICH = null; zeigeLogin(); });

/* ---------- Bausteine ---------- */
const stern = (art, id, ja) => `<button type="button" class="stern" data-wichtig="${art}:${id}" aria-pressed="${ja ? "true" : "false"}" title="${ja ? "Wichtig – nicht mehr markieren" : "Als wichtig markieren"}" aria-label="Wichtig">★</button>`;
const anrufKnopf = (fid, nummer, klein = true) => nummer ? `<button type="button" class="${klein ? "klein" : ""}" data-anrufen="${fid}" data-nummer="${esc(nummer)}" title="${ICH.sipgate ? "Über sipgate anrufen" : "Anrufen"}">📞 Anrufen</button>` : "";
const plusTageL = (n, von = heute()) => { const d = new Date(von + "T12:00:00"); d.setDate(d.getDate() + n); return d.toLocaleDateString("sv-SE"); };
const werktage = (n, von = heute()) => { let t = von; while (n > 0) { t = plusTageL(1, t); const wd = new Date(t + "T12:00:00").getDay(); if (wd !== 0 && wd !== 6) n--; } return t; };
const naechsterMontag = () => { let t = plusTageL(1); while (new Date(t + "T12:00:00").getDay() !== 1) t = plusTageL(1, t); return t; };
const auswahl = (name, liste, wert, leer) => `<select name="${name}">${leer !== undefined ? `<option value="">${esc(leer)}</option>` : ""}${Object.entries(liste).map(([k, v]) => `<option value="${k}" ${wert === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select>`;
const teamAuswahl = (name, wert) => `<select name="${name}"><option value="">${esc(ICH.name && ICH.team.includes(ICH.name) ? ICH.name + " (ich)" : "–")}</option>${ICH.team.filter((t) => t !== ICH.name).map((t) => `<option ${wert === t ? "selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
const geld = (ct) => `<span class="num">${eur(ct)}</span>`;

/** Eine offene Aufgabe (Wiedervorlage) mit Erledigt / Verschieben. */
function aufgabeLi(a, mitFirma = true) {
  const ueber = a.faellig < heute();
  return `<li class="${ueber ? "ueber" : a.wichtig || a.firma_wichtig ? "wichtig" : ""}">${stern("aufgabe", a.id, a.wichtig)}
    <div class="was"><b>${esc(a.titel)}</b>${mitFirma ? ` · <a href="#/firma/${a.firma_id}">${esc(a.firma)}</a>${a.firma_wichtig ? ' <span class="marke wait">wichtiger Kunde</span>' : ""}` : ""}
      <br><span class="leise">${ueber ? `<span class="fehler">überfällig seit ${datum(a.faellig)}</span>` : `fällig ${datum(a.faellig)}`}${a.zustaendig ? ` · für ${esc(a.zustaendig)}` : ""}${a.verschoben ? ` · ${a.verschoben}× verschoben` : ""}${a.grund ? ` · ${esc(a.grund)}` : ""}</span></div>
    <div class="tun">${["anruf", "nachfassen", "ablauf", "rueckgewinnung", "frist"].includes(a.art) && mitFirma ? anrufKnopf(a.firma_id, a.telefon) : ""}
      <button type="button" class="klein" data-erledigt="${a.id}">✓ Erledigt</button><button type="button" class="klein" data-verschieben="${a.id}" data-was="${esc(a.titel + (mitFirma ? " · " + a.firma : ""))}" data-zust="${esc(a.zustaendig || "")}">Verschieben</button></div></li>`;
}
const aufgabenListe = (liste, mitFirma = true, leer = "Nichts offen.") => liste.length ? `<ul class="aufgaben">${liste.map((a) => aufgabeLi(a, mitFirma)).join("")}</ul>` : `<p class="leise">${esc(leer)}</p>`;
const angebotStatus = (a) => a.status === "angenommen" ? '<span class="marke ok">angenommen</span>' : a.status === "abgelehnt" ? `<span class="marke bad">abgelehnt${a.verlustgrund ? ": " + esc(ICH.verlustgruende[a.verlustgrund] || a.verlustgrund) : ""}</span>`
  : a.abgelaufen ? '<span class="marke bad">abgelaufen</span>' : a.laeuft_ab ? `<span class="marke wait">läuft ${datum(a.gueltig_bis)} ab</span>` : `<span class="marke">offen bis ${datum(a.gueltig_bis)}</span>`;
const vertragStatus = (v) => v.status === "aktiv" ? '<span class="marke ok">aktiv</span>' : v.status === "unterlagen" ? '<span class="marke wait">Unterlagen fehlen</span>' : v.status === "gekuendigt" ? '<span class="marke wait">gekündigt</span>' : '<span class="marke">beendet</span>';

/* ---------- Ansichten ---------- */
const ANSICHTEN = {
  async heute(par) {
    const meine = par.get("meine") === "1";
    const [c, s] = await Promise.all([api("GET", "/cockpit" + (meine ? "?meine=1" : "")), api("GET", "/start")]);
    const b = s.bot || {};
    const ls = b.letzte_suche;
    const wo = ls ? (ls.modus === "bw" || ls.kachel ? "Baden-Württemberg" : `${esc(ICH.branchen[ls.branche] || ls.branche)} in ${esc(ls.region)}`) : "";
    const suche = [ls ? (ls.fehler ? `Letzte Suche am ${datum(ls.tag)}: OpenStreetMap gerade nicht erreichbar, neuer Versuch in 30 Minuten` : `Letzte Suche am ${datum(ls.tag)}: ${wo}, ${ls.neu} neue Firmen`) : "Der Bot hat noch nicht gesucht.",
      b.bw && b.bw.gesamt ? `Baden-Württemberg: ${Math.min(b.bw.zeiger, b.bw.gesamt)} von ${b.bw.gesamt} Gebieten abgesucht` : "",
      b.ki_heute && b.ki_heute.tag === heute() ? `${b.ki_heute.n} KI-Bewertungen heute` : ""].filter(Boolean).join(" · ");
    const w = c.wichtig;
    const wichtigLeer = !w.firmen.length && !w.vorgaenge.length && !w.aufgaben.length;
    const darfFiltern = ICH.team.includes(ICH.name);
    return `<div class="stapel"><div class="zeile zwischen"><div><h1>Heute</h1><p class="leise" style="margin:4px 0 0">${new Date().toLocaleDateString("de-DE", { weekday: "long", day: "numeric", month: "long" })}</p></div>
        <div class="zeile">${darfFiltern ? `<a class="knopf" href="#/heute${meine ? "" : "?meine=1"}">${meine ? "Alle anzeigen" : "Nur meine"}</a>` : ""}<a class="knopf" href="#/firmen?neu=1">+ Firma anlegen</a></div></div>
      <div class="zahlen"><div><b class="num">${c.faellig.length + c.impulse.length}</b><span>heute dran</span></div><div><b class="num ${c.ueberfaellig.length ? "fehler" : ""}">${c.ueberfaellig.length}</b><span>überfällig</span></div>
        <div><b class="num">${c.angebote.length}</b><span>offene Angebote</span></div><div><b class="num">${eur(c.vertraege.monat_ct)}</b><span>MRR aus ${c.vertraege.anzahl} Verträgen</span></div>
        <div><b class="num">${eur(c.zahlungen.offen_ct)}</b><span>offene Zahlungen${c.zahlungen.ueberfaellig.length ? `, ${c.zahlungen.ueberfaellig.length} überfällig` : ""}</span></div></div>
      ${c.ueberfaellig.length ? `<section class="blatt stapel"><h2 class="fehler">Überfällig</h2><p class="leise" style="margin:0">Nicht erledigte Wiedervorlagen bleiben hier stehen, bis sie erledigt oder verschoben sind.</p>${aufgabenListe(c.ueberfaellig)}</section>` : ""}
      <section class="blatt stapel"><h2>Heute fällig</h2>${aufgabenListe(c.faellig, true, "Keine Wiedervorlagen für heute.")}</section>
      <section class="blatt stapel"><div class="zeile zwischen"><h2>Anruf-Impulse</h2><span class="leise">vom Bot gefunden und bewertet</span></div>
        ${c.impulse.length ? `<div class="tabelle"><table><thead><tr><th></th><th>Firma</th><th>Punkte</th><th>Warum anrufen</th><th></th></tr></thead><tbody>
        ${c.impulse.map((f) => `<tr><td>${stern("firma", f.id, f.wichtig)}</td><td><a href="#/firma/${f.id}"><b>${esc(f.name)}</b></a><br><span class="leise">${esc([f.branche, f.ort].filter(Boolean).join(", "))}</span><br>${telLink(f.telefon)}</td>
          <td>${scoreHtml(f.score)}</td><td class="zweit">${esc(f.score_grund || "")}${f.einstieg ? `<br><span class="leise">Einstieg: „${esc(f.einstieg)}“</span>` : ""}</td>
          <td><div class="tun zeile">${anrufKnopf(f.id, f.telefon)}<button type="button" class="klein" data-spaeter="${f.id}" data-was="${esc(f.name)}">Später</button></div></td></tr>`).join("")}</tbody></table></div>`
        : `<p class="leise">Gerade keine neuen Impulse. Der Bot sucht laufend neue Firmen und bewertet sie.</p>`}</section>
      <div class="raster"><div class="stapel">

  async pipeline() {
    const p = await api("GET", "/pipeline");

      ${(p.spalten[s] || []).map((f) => `<a class="karte" href="#/firma/${f.id}">${f.wichtig ? '<span style="color:var(--signal)">★</span> ' : ""}<b>${esc(f.name)}</b>${f.gesperrt ? ' <span class="marke bad">gesperrt</span>' : ""}<br><span class="leise">${esc(f.ort || "")}${f.score != null ? ` · ${f.score} Punkte` : ""}${f.wiedervorlage ? ` · WV ${datum(f.wiedervorlage)}` : ""}</span></a>`).join("")}

            ${!ICH.absender ? '<p class="leise">Info-Mails sind noch ausgeschaltet: Es fehlt ein Absender (VERTRIEB_ABSENDER) für eure eigene Domain. Vorlage und Ablauf vorher anwaltlich prüfen lassen.</p>' : ""}`
            : `<p class="zweit">Keine Einwilligung. Werbe-Mails sind gesperrt, auch an info@-Adressen.</p><details><summary>Einwilligung eintragen</summary><form id="einw" class="stapel" style="margin-top:12px"><label>Nachweis (wann, wie, wer)<textarea name="nachweis" required placeholder="z. B. Telefonat am 03.11. mit Herrn X, möchte Infos per Mail"></textarea></label><button type="submit">Einwilligung speichern</button></form></details>`}
        </section>
        <section class="blatt stapel"><h2>Ansprechpartner</h2>
          ${f.ansprechpartner.map((a) => `<div class="zeile zwischen"><div><b>${esc(a.name)}</b> <span class="leise">${esc(a.rolle || "")}</span><br>${a.telefon ? telLink(a.telefon) + " " + (f.gesperrt ? "" : anrufKnopf(f.id, a.telefon)) : ""}${a.email ? ` <a href="mailto:${esc(a.email)}">${esc(a.email)}</a>` : ""}</div><button type="button" class="gefahr" data-apweg="${a.id}" aria-label="Entfernen">✕</button></div>`).join("") || '<p class="leise">Noch niemand eingetragen.</p>'}
          <details><summary>Ansprechpartner hinzufügen</summary><form id="ap" class="stapel" style="margin-top:12px"><label>Name<input name="name" required></label><label>Rolle<input name="rolle" placeholder="z. B. Inhaber"></label><label>Telefon direkt<input name="telefon" type="tel"></label><label>E-Mail<input name="email" type="email"></label><button type="submit">Hinzufügen</button></form></details>
        </section>
        <section class="blatt stapel"><h2>Kundenakte</h2>
          ${f.dokumente.map((d) => `<div class="zeile zwischen"><div><a href="/api/crm/dokument/${esc(d.id)}">${esc(d.titel)}</a><br><span class="leise">${esc(d.typ)} · ${datum(d.datum)} · ${Math.max(1, Math.round(d.groesse / 1024))} KB</span></div><button type="button" class="gefahr" data-dokweg="${esc(d.id)}" aria-label="Löschen">✕</button></div>`).join("") || '<p class="leise">Noch keine Dateien.</p>'}
          <form id="dok" class="stapel"><label>Datei (max. 10 MB)<input type="file" name="datei" required></label><label>Titel<input name="titel" placeholder="z. B. Angebot A-2026-001"></label>
            <label>Art<select name="typ"><option value="angebot">Angebot</option><option value="vertrag">Vertrag</option><option value="protokoll">Protokoll</option><option value="notiz">Notiz</option><option value="sonstiges">Sonstiges</option></select></label><button type="submit">Hochladen</button></form>
        </section>
        <details class="blatt"><summary>Stammdaten bearbeiten</summary><form id="stamm" class="stapel" style="margin-top:12px">
          <label>Name<input name="name" value="${esc(f.name)}" required></label><label>Branche<input name="branche" value="${esc(f.branche || "")}"></label>
          <label>Status<select name="status">${Object.entries(STATUS()).map(([k, v]) => `<option value="${k}" ${f.status === k ? "selected" : ""}>${esc(v)}</option>`).join("")}</select></label>
          <label>Telefon<input name="telefon" value="${esc(f.telefon || "")}"></label><label>Website<input name="website" value="${esc(f.website || "")}"></label><label>E-Mail (allgemein)<input name="email" value="${esc(f.email || "")}"></label>
          <label>Straße<input name="strasse" value="${esc(f.strasse || "")}"></label><label>PLZ<input name="plz" value="${esc(f.plz || "")}"></label><label>Ort<input name="ort" value="${esc(f.ort || "")}"></label>
          <label>Zuständig<input name="zustaendig" list="teamListe" value="${esc(f.zustaendig || "")}"></label><datalist id="teamListe">${ICH.team.map((t) => `<option value="${esc(t)}">`).join("")}</datalist>
          <label>Notiz<textarea name="notiz">${esc(f.notiz || "")}</textarea></label><button class="haupt" type="submit">Speichern</button></form></details>
        <div class="zeile">${f.gesperrt ? "" : `<button type="button" id="bewerten">${f.score == null ? "Mit KI bewerten" : "Neu bewerten"}</button>`}${f.gesperrt ? '<button type="button" id="entsperren">Sperre aufheben</button>' : '<button type="button" class="gefahr" id="sperren">Sperren</button>'}<button type="button" class="gefahr" id="loeschen">Firma löschen</button></div>
        <p class="leise">Quelle: ${esc(f.quelle || "")}${f.quelle_id && f.quelle_id.startsWith("osm:") ? " (OpenStreetMap)" : ""} · angelegt ${datum(f.erstellt)}</p>
      </div></div></div>`;
  },
  async angebote(par) {
    const alle = par.get("alle") === "1";
    const l = await api("GET", "/angebote" + (alle ? "" : "?offen=1"));
    const summe = l.liste.filter((a) => a.status === "offen" && !a.abgelaufen).reduce((n, a) => n + a.monat_ct, 0);
    return `<div class="stapel"><div class="zeile zwischen"><h1>${alle ? "Alle Angebote" : "Offene Angebote"}</h1><a class="knopf" href="#/angebote${alle ? "" : "?alle=1"}">${alle ? "Nur offene" : "Alle ansehen"}</a></div>
      ${alle ? "" : `<p class="zweit">Zusammen <b class="num">${eur(summe)}</b> monatlich in offenen, gültigen Angeboten.</p>`}
      <div class="tabelle"><table><thead><tr><th></th><th>Firma</th><th>Angebot</th><th class="betrag">Anschluss</th><th class="betrag">Monatlich</th><th>Status</th></tr></thead><tbody>
      ${l.liste.map((a) => `<tr class="klick" data-href="#/firma/${a.firma_id}"><td>${stern("angebot", a.id, a.wichtig)}</td><td><a href="#/firma/${a.firma_id}"><b>${esc(a.firma)}</b></a>${a.firma_wichtig ? ' <span class="marke wait">wichtig</span>' : ""}</td>
        <td>${esc(a.nummer)}<br><span class="leise">${esc(a.produkt || "")}, ${esc(a.laufzeit || "")} · ${datum(a.datum)}</span></td><td class="betrag">${eur(a.einmal_ct)}</td><td class="betrag">${eur(a.monat_ct)}</td><td>${angebotStatus(a)}</td></tr>`).join("") || '<tr><td colspan="6" class="leise">Keine Angebote.</td></tr>'}</tbody></table></div></div>`;
  },
  async vertraege(par) {
    const laufend = par.get("alle") !== "1";
    const l = await api("GET", "/vertraege?laufend=" + (laufend ? "1" : "0"));
    const summe = l.liste.filter((v) => v.status !== "unterlagen").reduce((n, v) => n + (laufend ? v.monat_ct : 0), 0);
    return `<div class="stapel"><div class="zeile zwischen"><h1>${laufend ? "Laufende Verträge" : "Beendete Verträge"}</h1><a class="knopf" href="#/vertraege${laufend ? "?alle=1" : ""}">${laufend ? "Beendete ansehen" : "Laufende ansehen"}</a></div>
      ${laufend ? `<p class="zweit">Zusammen <b class="num">${eur(summe)}</b> pro Monat (netto, ohne Verträge mit fehlenden Unterlagen).</p>` : ""}
      <div class="tabelle"><table><thead><tr><th>Firma</th><th>Vertrag</th><th>Beginn</th><th>Kündbar bis</th><th class="betrag">Monatlich</th><th>Unterlagen / Einrichtung</th><th>Status</th></tr></thead><tbody>
      ${l.liste.map((v) => `<tr class="klick" data-href="#/firma/${v.firma_id}"><td>${v.firma_wichtig ? '<span style="color:var(--signal)">★</span> ' : ""}<a href="#/firma/${v.firma_id}"><b>${esc(v.firma)}</b></a></td><td>${esc(v.nummer)}<br><span class="leise">${esc(v.produkt || "")}${v.laufzeit ? ", " + esc(v.laufzeit) : ""}</span></td><td>${datum(v.beginn)}${v.ende ? `<br><span class="leise">bis ${datum(v.ende)}</span>` : ""}</td>
        <td>${v.fristen ? datum(v.fristen.kuendigen_bis) : '<span class="leise">–</span>'}</td><td class="betrag">${eur(v.monat_ct)}</td>
        <td>${v.unterlagen_fehlen.length ? `<span class="marke wait">fehlt: ${v.unterlagen_fehlen.map((k) => esc(k.toUpperCase())).join(", ")}</span>` : '<span class="marke ok">vollständig</span>'}<br><span class="leise">${esc(v.onboarding_stand)}</span></td><td>${vertragStatus(v)}</td></tr>`).join("") || '<tr><td colspan="7" class="leise">Keine Verträge.</td></tr>'}</tbody></table></div></div>`;
  },
  async zahlungen(par) {
    const alle = par.get("alle") === "1";
    const l = await api("GET", "/zahlungen" + (alle ? "" : "?offen=1"));
    if (!alle) l.liste.sort((a, b) => (b.firma_wichtig ? 1 : 0) - (a.firma_wichtig ? 1 : 0) || (a.zahlstatus === "ueberfaellig" ? 0 : 1) - (b.zahlstatus === "ueberfaellig" ? 0 : 1) || a.faellig.localeCompare(b.faellig));
    const summe = l.liste.filter((z) => !z.bezahlt).reduce((n, z) => n + z.betrag_ct, 0);
    return `<div class="stapel"><div class="zeile zwischen"><h1>${alle ? "Alle Zahlungen" : "Offene Zahlungen"}</h1><a class="knopf" href="#/zahlungen${alle ? "" : "?alle=1"}">${alle ? "Nur offene" : "Alle ansehen"}</a></div>
      <p class="zweit">Offen: <b class="num">${eur(summe)}</b> (netto)</p>${zahlTabelle(l.liste, true)}</div>`;
  },
  async bericht() {
    const { wochen } = await api("GET", "/bericht?wochen=8");
    const max = Math.max(1, ...wochen.map((w) => w.anrufe));
    const verlust = {};
    for (const w of wochen) for (const [g, n] of Object.entries(w.verlust)) verlust[g] = (verlust[g] || 0) + n;
    const vMax = Math.max(1, ...Object.values(verlust));
    const akt = wochen[0], vor = wochen[1];
    const delta = (a, b) => a === b ? "" : ` <span class="leise">(${a > b ? "+" : ""}${a - b} zur Vorwoche)</span>`;
    return `<div class="stapel"><h1>Wochenbericht</h1><p class="zweit">Kennzahlen pro Woche (Montag bis Sonntag). Montags ab 8 Uhr kommt der Bericht der Vorwoche auch per Mail.</p>
      <div class="zahlen"><div><b class="num">${akt.anrufe}</b><span>Anrufe diese Woche${delta(akt.anrufe, vor.anrufe)}</span></div><div><b class="num">${akt.termine}</b><span>Termine${delta(akt.termine, vor.termine)}</span></div>
        <div><b class="num">${akt.abschluesse}</b><span>Abschlüsse${delta(akt.abschluesse, vor.abschluesse)}</span></div><div><b class="num">${eur(akt.mrr_ct)}</b><span>MRR (monatlich wiederkehrend)</span></div></div>
      <div class="tabelle"><table><thead><tr><th>Woche</th><th>Anrufe</th><th>Erreicht</th><th>Termine</th><th>Angebote</th><th>Abschlüsse</th><th class="betrag">Neu MRR</th><th class="betrag">MRR</th></tr></thead><tbody>
      ${wochen.map((w, i) => `<tr><td>${datum(w.montag)} – ${datum(w.bis)}${i === 0 ? ' <span class="marke">läuft</span>' : ""}</td><td class="num">${w.anrufe}<span class="balken" style="width:${Math.round(60 * w.anrufe / max)}px"></span></td><td class="num">${w.erreicht}</td>
        <td class="num">${w.termine}</td><td class="num">${w.angebote}</td><td class="num">${w.abschluesse}</td><td class="betrag">${eur(w.neu_mrr_ct)}</td><td class="betrag">${eur(w.mrr_ct)}</td></tr>`).join("")}</tbody></table></div>
      <div class="raster"><section class="blatt stapel"><h2>Diese Woche pro Person</h2>${akt.pro_person.length ? `<table><thead><tr><th>Wer</th><th>Anrufe</th><th>Termine</th></tr></thead><tbody>${akt.pro_person.map((p) => `<tr><td>${esc(p.durch)}</td><td class="num">${p.anrufe}</td><td class="num">${p.termine}</td></tr>`).join("")}</tbody></table>` : '<p class="leise">Diese Woche noch keine Anrufe erfasst.</p>'}</section>
        <section class="blatt stapel"><h2>Verlustgründe (8 Wochen)</h2>${Object.keys(verlust).length ? `<table><tbody>${Object.entries(verlust).sort((a, b) => b[1] - a[1]).map(([g, n]) => `<tr><td>${esc(ICH.verlustgruende[g] || g)}</td><td class="num">${n}<span class="balken" style="width:${Math.round(60 * n / vMax)}px"></span></td></tr>`).join("")}</tbody></table>` : '<p class="leise">Noch keine Absagen erfasst.</p>'}</section></div></div>`;
  },
  async produkte() {
    const l = await api("GET", "/produkte");
    ANSICHTEN._produktListe = l.liste;
    return `<div class="stapel"><h1>Produkte und Preise</h1><p class="zweit">Pro Produkt mehrere Laufzeiten, jede mit eigener Anschluss- und Monatsgebühr. Angebote und Verträge übernehmen die Werte. Preise netto.</p>
      <div class="tabelle"><table><thead><tr><th>Produkt</th><th>Laufzeiten</th><th>Enthalten</th><th></th></tr></thead><tbody>
      ${l.liste.map((p) => `<tr><td><b>${esc(p.name)}</b>${p.aktiv ? "" : ' <span class="marke">inaktiv</span>'}<br><span class="leise">${esc(p.beschreibung || "")}</span></td>
        <td>${p.laufzeiten.map((z) => `<div><b>${esc(z.name)}</b>: ${eur(z.einmal_ct)} Anschluss + ${eur(z.monat_ct)}/Monat <span class="leise">· Frist ${esc(z.kuendigungsfrist)}</span></div>`).join("")}</td><td>${esc(p.leistung || "")}</td>
        <td><button type="button" class="klein" data-produkt="${p.id}">Bearbeiten</button></td></tr>`).join("") || '<tr><td colspan="4" class="leise">Noch keine Produkte. Giosuè liefert die echten Preise nach.</td></tr>'}</tbody></table></div>
      <form id="produkt" class="blatt stapel"><h2 id="produktTitel">Produkt anlegen</h2><input type="hidden" name="pid"><div class="felder">
        <label>Name<input name="name" required></label><label>Enthalten<input name="leistung" placeholder="z. B. 300 Minuten"></label><label class="breit">Beschreibung<textarea name="beschreibung"></textarea></label>
        <label class="check"><input type="checkbox" name="aktiv" checked> <span>aktiv</span></label></div>
        <h3>Laufzeiten</h3><div id="laufzeiten" class="stapel"></div><div><button type="button" id="lzNeu" class="klein">+ Laufzeit</button></div>
        <div class="zeile"><button class="haupt" type="submit">Speichern</button><button type="button" id="produktNeu">Neues Produkt</button></div></form></div>`;

  async leitfaeden(par) {
    const l = await api("GET", "/leitfaeden");
    ANSICHTEN._leitfaeden = l.liste;
    return `<div class="stapel"><h1>Gesprächsleitfäden</h1><p class="zweit">Pro Branche Einstieg, wichtige Fragen und Antworten auf Einwände. In der Kundenakte erscheint der Leitfaden, dessen Name oder Stichwort in der Branche der Firma vorkommt, sonst „Allgemein“.</p>
      ${l.liste.map((x) => `<details class="blatt"><summary>${esc(x.name)}${x.stichworte ? ` <span class="leise">(${esc(x.stichworte)})</span>` : ""}</summary><form class="stapel" data-leitfaden="${x.id}" style="margin-top:12px">${leitfadenFelder(x)}
        <div class="zeile"><button class="haupt" type="submit">Speichern</button>${x.name === "Allgemein" ? "" : `<button type="button" class="gefahr" data-lfweg="${x.id}">Löschen</button>`}</div></form></details>`).join("")}
      <details class="blatt" ${l.liste.length < 2 ? "open" : ""}><summary>Neuer Leitfaden</summary><form class="stapel" data-leitfaden="" style="margin-top:12px">${leitfadenFelder({})}<button class="haupt" type="submit">Anlegen</button></form></details></div>`;
  },
  async einstellungen() {
    const { einstellungen: e } = await api("GET", "/einstellungen");
    const s = await api("GET", "/start");
    return `<div class="stapel"><h1>Einstellungen</h1>
      <form id="einst" class="blatt stapel"><h2>Akquise-Bot</h2>
        <label class="check"><input type="checkbox" name="bot_aktiv" ${e.bot_aktiv ? "checked" : ""}> <span>Bot ist aktiv (sucht neue Firmen, bewertet sie, schickt werktags ab 8 Uhr Anruf-Impulse und ab 14 Uhr einen Nachtrag)</span></label>
        <fieldset style="border:0;padding:0;margin:0"><legend class="leise">Wo sucht der Bot?</legend><div class="radios">
          <label><input type="radio" name="suchmodus" value="bw" ${e.suchmodus === "bw" ? "checked" : ""}> Ganz Baden-Württemberg, alle Branchen (Firmen mit Website oder E-Mail, ohne Filialketten)</label>
          <label><input type="radio" name="suchmodus" value="branchen" ${e.suchmodus === "branchen" ? "checked" : ""}> Nur die Zielbranchen in den Zielregionen unten</label></div></fieldset>
        <div class="felder"><label>KI-Bewertungen pro Tag (Kostenbremse, je ca. 0,05 Cent)<input name="ki_pro_tag" type="number" min="0" max="1000" value="${e.ki_pro_tag}"></label></div>
        <details ${e.suchmodus === "branchen" ? "open" : ""}><summary>Zielbranchen und Zielregionen (nur für „Nur die Zielbranchen“)</summary><div class="stapel" style="margin-top:12px">
        <fieldset style="border:0;padding:0;margin:0"><legend class="leise">Zielbranchen</legend><div class="radios">${Object.entries(ICH.branchen).map(([k, v]) => `<label><input type="checkbox" name="b_${k}" ${e.zielbranchen.includes(k) ? "checked" : ""}> ${esc(v)}</label>`).join("")}</div></fieldset>
        <div class="felder"><label class="breit">Zielregionen (Städte, Landkreise oder Bundesländer, eine pro Zeile)<textarea name="zielregionen">${esc(e.zielregionen.join("\n"))}</textarea></label>
          <label>Höchstens neue Firmen pro Suche<input name="neue_pro_lauf" type="number" min="5" max="100" value="${e.neue_pro_lauf}"></label></div></div></details>
        <div class="felder"><label>Anruf-Impuls ab Punkten<input name="schwelle" type="number" min="0" max="100" value="${e.schwelle}"></label><label>Impulse pro Tag<input name="impulse_pro_tag" type="number" min="1" max="100" value="${e.impulse_pro_tag}"></label>
          <label>Anruf-Impulse an<input name="impulse_an" type="email" value="${esc(e.impulse_an)}"></label></div>
        <h2>Team, Angebote, Verträge</h2><div class="felder">
          <label>Team (Namen, eine pro Zeile)<textarea name="team" rows="3">${esc(e.team.join("\n"))}</textarea></label><label>Technische Einrichtung übernimmt<input name="technik" value="${esc(e.technik)}"></label>
          <label>Angebot nachfassen nach (Werktagen, 0 = aus)<input name="nachfassen_tage" type="number" min="0" max="60" value="${e.nachfassen_tage}"></label>

          <label>Angebot gültig (Tage)<input name="angebot_gueltig_tage" type="number" min="1" max="365" value="${e.angebot_gueltig_tage}"></label>
          <label>Fristen-Wächter: so viele Tage vor dem letzten Kündigungstag erinnern<input name="frist_vorlauf_tage" type="number" min="1" max="365" value="${e.frist_vorlauf_tage}"></label></div>
        <label class="check"><input type="checkbox" name="wochenbericht" ${e.wochenbericht ? "checked" : ""}> <span>Wochenbericht montags ab 8 Uhr per Mail an „Anruf-Impulse an“</span></label>

        <pre id="botBericht" class="leise" style="white-space:pre-wrap;margin:0"></pre></section></div>`;
  },
};
const leitfadenFelder = (x) => `<div class="felder"><label>Branche / Name<input name="name" required value="${esc(x.name || "")}" ${x.name === "Allgemein" ? "readonly" : ""}></label>
  <label>Stichworte (kommagetrennt)<input name="stichworte" value="${esc(x.stichworte || "")}" placeholder="z. B. kfz, werkstatt, reifen"></label>
  <label class="breit">Einstieg<textarea name="einstieg" rows="4">${esc(x.einstieg || "")}</textarea></label>
  <label class="breit">Wichtige Fragen<textarea name="fragen" rows="5">${esc(x.fragen || "")}</textarea></label>
  <label class="breit">Häufige Einwände und Antworten<textarea name="einwaende" rows="6">${esc(x.einwaende || "")}</textarea></label></div>`;
function zahlTabelle(liste, mitFirma) {
  return `<div class="tabelle"><table><thead><tr>${mitFirma ? "<th>Firma</th>" : ""}<th>Posten</th><th>Fällig</th><th class="betrag">Betrag</th><th>Status</th><th></th></tr></thead><tbody>
    ${liste.map((z) => `<tr>${mitFirma ? `<td>${z.firma_wichtig ? '<span style="color:var(--signal)">★</span> ' : ""}<a href="#/firma/${z.firma_id}"><b>${esc(z.firma)}</b></a><br><span class="leise">${esc(z.vertrag)}</span></td>` : ""}<td>${z.art === "einrichtung" ? "Einrichtung" : "Monat " + esc(z.leistungsmonat)}</td><td>${datum(z.faellig)}</td>
      <td class="betrag">${eur(z.betrag_ct)}</td><td>${z.zahlstatus === "bezahlt" ? `<span class="marke ok">bezahlt ${datum(z.bezahlt_am)}</span>` : z.zahlstatus === "ueberfaellig" ? '<span class="marke bad">überfällig</span>' : '<span class="marke">offen</span>'}</td>
      <td>${z.bezahlt ? `<button type="button" class="klein" data-unbezahlt="${z.id}">Zurücksetzen</button>` : `<button type="button" class="klein" data-bezahlt="${z.id}">Bezahlt</button>`}</td></tr>`).join("") || `<tr><td colspan="${mitFirma ? 6 : 5}" class="leise">Keine Posten.</td></tr>`}</tbody></table></div>`;
}

/* ---------- Aktionen, die überall gehen (einmal am Dokument angemeldet) ---------- */
async function anrufen(fid, nummer) {
  try {
    const r = await api("POST", `/firma/${fid}/anrufen`, { nummer });
    if (r.sipgate) toast("sipgate klingelt jetzt zuerst bei dir, dann wird die Firma angerufen.");
    else location.href = "tel:" + r.nummer;
    const ziel = `#/firma/${fid}?anruf=1`;
    setTimeout(() => { if (location.hash.split("?")[0] !== `#/firma/${fid}`) location.hash = ziel; else { $("#anruf")?.scrollIntoView({ behavior: "smooth" }); } }, 400);
  } catch (e) { if (e.message !== "abgemeldet") toast(e.message); }
}
/** Wiedervorlage-Dialog: für eine bestehende Aufgabe (verschieben) oder eine Firma (neu anlegen). */
function wvDialog(ziel) {
  const d = $("#wv"), f = $("#wvForm");
  $("#wvTitel").textContent = ziel.aufgabe ? "Verschieben" : "Wiedervorlage";
  $("#wvWas").textContent = ziel.was || "";
  f.elements.faellig.value = werktage(1); f.elements.grund.value = "";
  f.elements.zustaendig.innerHTML = ICH.team.map((t) => `<option ${(ziel.zust || ICH.name) === t ? "selected" : ""}>${esc(t)}</option>`).join("") + (ICH.team.includes(ICH.name) || ziel.zust ? "" : `<option value="" selected>–</option>`);
  const chips = [["Morgen", werktage(1)], ["Übermorgen", werktage(2)], ["Nächste Woche", naechsterMontag()], ["In 2 Wochen", werktage(10)]];
  $("#wvChips").innerHTML = chips.map(([t, v]) => `<button type="button" class="klein" data-tag="${v}">${t}</button>`).join("");
  $("#wvChips").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { f.elements.faellig.value = b.dataset.tag; }));
  wvDialog.ziel = ziel;
  d.showModal();
}
$("#wvAbbrechen").addEventListener("click", () => $("#wv").close());
$("#wvForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const d = formDaten(e.target), z = wvDialog.ziel;
  try {
    if (z.aufgabe) await api("POST", `/aufgabe/${z.aufgabe}/verschieben`, d);
    else await api("POST", `/firma/${z.firma}/aufgabe`, { art: "anruf", ...d });
    $("#wv").close();
    toast(`Wiedervorlage am ${datum(d.faellig)}${d.zustaendig && d.zustaendig !== ICH.name ? ` für ${d.zustaendig}` : ""}.`);
    zeichnen();
  } catch (err) { if (err.message !== "abgemeldet") toast(err.message); }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-wichtig],[data-anrufen],[data-erledigt],[data-verschieben],[data-spaeter]");
  if (!b) return;
  e.preventDefault(); e.stopPropagation();
  try {
    if (b.dataset.wichtig) {
      const [art, id] = b.dataset.wichtig.split(":"), ja = b.getAttribute("aria-pressed") !== "true";
      await api("POST", "/wichtig", { art, id: Number(id), ja });
      b.setAttribute("aria-pressed", String(ja)); toast(ja ? "Als wichtig markiert – steht jetzt in den Listen oben." : "Markierung entfernt.");
    } else if (b.dataset.anrufen) anrufen(b.dataset.anrufen, b.dataset.nummer);
    else if (b.dataset.erledigt) { b.disabled = true; await api("POST", `/aufgabe/${b.dataset.erledigt}/erledigt`, {}); toast("Erledigt."); zeichnen(); }
    else if (b.dataset.verschieben) wvDialog({ aufgabe: b.dataset.verschieben, was: b.dataset.was, zust: b.dataset.zust });
    else if (b.dataset.spaeter) wvDialog({ firma: b.dataset.spaeter, was: b.dataset.was });
  } catch (err) { b.disabled = false; if (err.message !== "abgemeldet") toast(err.message); }
}, true);

/* ---------- Aktionen nach dem Zeichnen ---------- */
function laufzeitWahl(form, mitPreis) {
  const el = form.elements;
  const fuellen = () => {
    const p = (ANSICHTEN._produkte || []).find((x) => String(x.id) === el.produkt_id.value);
    el.laufzeit_id.innerHTML = p ? p.laufzeiten.map((z) => `<option value="${z.id}">${esc(z.name)} – ${eur(z.einmal_ct)} + ${eur(z.monat_ct)}/Monat</option>`).join("") : `<option value="">${el.produkt_id.value ? "–" : "erst Produkt wählen"}</option>`;
    zeigen();
  };
  const zeigen = () => {
    const p = (ANSICHTEN._produkte || []).find((x) => String(x.id) === el.produkt_id.value);
    const z = p && p.laufzeiten.find((x) => String(x.id) === el.laufzeit_id.value);
    if (mitPreis) mitPreis.textContent = z ? `${p.name}, ${z.name}: ${eur(z.einmal_ct)} Anschlussgebühr + ${eur(z.monat_ct)} monatlich · Kündigungsfrist ${z.kuendigungsfrist}` : "";
    form.querySelectorAll(".frei").forEach((x) => x.classList.toggle("versteckt", !!p));
  };
  el.produkt_id.addEventListener("change", fuellen); el.laufzeit_id.addEventListener("change", zeigen); fuellen();
}
function laufzeitZeile(z = {}) {
  const opts = [0, 3, 6, 12, 24, 36]; if (z.monate !== undefined && !opts.includes(z.monate)) opts.push(z.monate);
  return `<div class="felder lz" data-id="${esc(z.id || "")}"><label>Laufzeit<select name="lz_monate">${opts.sort((a, b) => a - b).map((m) => `<option value="${m}" ${Number(z.monate || 0) === m ? "selected" : ""}>${m ? m + " Monate" : "Monatlich kündbar"}</option>`).join("")}</select></label>
    <label>Kündigungsfrist (Monate)<input name="lz_frist" type="number" min="0" max="24" value="${z.frist_monate ?? 1}"></label>
    <label>Anschlussgebühr (€)<input name="lz_einmal" inputmode="decimal" value="${eurFeld(z.einmal_ct || 0)}"></label><label>Monatlich (€)<input name="lz_monat" inputmode="decimal" value="${eurFeld(z.monat_ct || 0)}"></label>
    <div style="align-self:end"><button type="button" class="gefahr klein" data-lzweg aria-label="Laufzeit entfernen">✕ entfernen</button></div></div>`;
}
function verdrahten(name, idTeil, par) {
  document.querySelectorAll("tr.klick").forEach((tr) => tr.addEventListener("click", (e) => { if (!e.target.closest("a,button,input,select,details")) location.hash = tr.dataset.href; }));
  document.querySelectorAll("[data-bezahlt],[data-unbezahlt]").forEach((b) => b.addEventListener("click", async () => {
    const bez = !!b.dataset.bezahlt; let d;
    if (bez) { d = prompt("Bezahlt am (TT.MM.JJJJ)?", new Date().toLocaleDateString("de-DE")); if (d === null) return; const m = d.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/); d = m ? `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}` : undefined; }
    try { await api("POST", "/zahlung/" + (b.dataset.bezahlt || b.dataset.unbezahlt), { bezahlt: bez, datum: d }); toast(bez ? "Als bezahlt markiert." : "Zurückgesetzt."); zeichnen(); } catch (e) { toast(e.message); }
  }));
  if (name === "firmen") {
    $("#neuKnopf").addEventListener("click", () => { $("#neuForm").classList.toggle("versteckt"); $("#neuForm").elements.name.focus(); });
    const nf = $("#neuForm");
    let warte;
    const pruefen = async () => {
      const d = formDaten(nf); const box = $("#dubletten");
      if ((d.name || "").trim().length < 3 && !d.telefon && !d.website) { box.classList.add("versteckt"); return; }
      const qs = new URLSearchParams(); for (const k of ["name", "plz", "ort", "telefon", "website"]) if (d[k]) qs.set(k, d[k]);
      try {
        const r = await api("GET", "/dubletten?" + qs);
        box.classList.toggle("versteckt", !r.liste.length);
        box.innerHTML = r.liste.length ? `<b>Achtung, die Firma gibt es vielleicht schon:</b><ul style="margin:6px 0 0;padding-left:18px">${r.liste.map((x) => `<li><a href="#/firma/${x.id}">${esc(x.name)}</a> <span class="leise">${esc([x.plz, x.ort].filter(Boolean).join(" "))} · ${esc(x.grund)}</span>${x.sicher ? ' <span class="marke bad">sicher doppelt</span>' : ""}</li>`).join("")}</ul>` : "";
      } catch { /* Warnung ist nur ein Hinweis */ }
    };
    nf.addEventListener("input", () => { clearTimeout(warte); warte = setTimeout(pruefen, 400); });
    beiAbsenden(nf, async (d) => { const r = await api("POST", "/firmen", d); toast(r.neu ? "Firma angelegt." : "Die Firma gibt es schon – sie wurde geöffnet, nichts doppelt angelegt."); location.hash = "#/firma/" + r.id; });
    beiAbsenden($("#suche"), async (d) => { const q = new URLSearchParams(); if (d.q) q.set("q", d.q); if (d.status) q.set("status", d.status); location.hash = "#/firmen?" + q; });
  }
  if (name === "firma") {
    const fid = idTeil, neu = () => zeichnen();
    const anruf = $("#anruf");
    if (par.get("anruf") && !anruf.classList.contains("versteckt")) setTimeout(() => anruf.scrollIntoView({ behavior: "smooth" }), 50);
    anruf.addEventListener("change", () => {
      const erg = formDaten(anruf).ergebnis;
      $("#einwBox").classList.toggle("versteckt", erg !== "infos_mail");
      $("#verlustBox").classList.toggle("versteckt", erg !== "kein_interesse" && erg !== "widerspruch");
      if (["infos_mail", "termin", "rueckruf"].includes(erg)) $("#qualiBox").open = true;
    });
    beiAbsenden(anruf, async (d) => {
      if (d.ergebnis === "kein_interesse" && !d.verlustgrund) throw new Error("Bitte einen Verlustgrund wählen.");
      if (d.ergebnis === "widerspruch" && !confirm("Die Firma wird gesperrt: keine Anrufe und keine Mails mehr. Fortfahren?")) return;
      const r = await api("POST", `/firma/${fid}/anruf`, d);
      toast(r.wiedervorlage ? `Gespeichert. Wiedervorlage am ${datum(r.wiedervorlage)}${d.zustaendig ? " für " + d.zustaendig : ""}.` : "Gespeichert.");
      if (r.infomail && ICH.absender && confirm("Einwilligung gespeichert. Info-Mail jetzt senden?")) { try { await api("POST", `/firma/${fid}/infomail`, {}); toast("Info-Mail verschickt."); } catch (e) { toast(e.message); } }
      if (d.ergebnis === "termin" && confirm("Termin vereinbart. Gleich ein Angebot vorbereiten?")) { location.hash = `#/firma/${fid}?angebot=1`; return; }
      location.hash = `#/firma/${fid}`; neu();
    });
    beiAbsenden($("#kontakt"), async (d) => { await api("POST", `/firma/${fid}/kontakt`, d); toast("Eingetragen."); neu(); });
    beiAbsenden($("#stamm"), async (d) => { await api("PUT", `/firma/${fid}`, d); toast("Gespeichert."); neu(); });
    beiAbsenden($("#ap"), async (d) => { await api("POST", `/firma/${fid}/ansprechpartner`, d); neu(); });
    const unterl = (d) => Object.fromEntries(Object.keys(ICH.unterlagen).map((k) => [k, !!d["u_" + k]]));
    if ($("#angebot")) { laufzeitWahl($("#angebot"), $("#angebotPreis")); beiAbsenden($("#angebot"), async (d) => { const r = await api("POST", `/firma/${fid}/angebot`, d); toast(`Angebot ${r.nummer} erfasst. Nachfassen ist eingeplant.`); location.hash = `#/firma/${fid}`; neu(); }); }
    document.querySelectorAll("[data-annehmen]").forEach((f) => beiAbsenden(f, async (d) => { const r = await api("POST", `/angebot/${f.dataset.annehmen}/entscheiden`, { status: "angenommen", beginn: d.beginn, unterlagen: unterl(d) }); toast(`Vertrag ${r.vertrag.nummer} angelegt${r.vertrag.status === "aktiv" ? " und aktiv" : " – aktiv, sobald alle Unterlagen da sind"}.`); neu(); }));
    document.querySelectorAll("[data-ablehnen]").forEach((f) => beiAbsenden(f, async (d) => { if (!d.verlustgrund) throw new Error("Bitte einen Verlustgrund wählen."); await api("POST", `/angebot/${f.dataset.ablehnen}/entscheiden`, { status: "abgelehnt", ...d }); toast("Absage gespeichert."); neu(); }));
    const vf = $("#vertrag");
    laufzeitWahl(vf, null);
    beiAbsenden(vf, async (d) => { if (!d.produkt_id && !d.produkt) throw new Error("Bitte ein Produkt wählen oder eine Bezeichnung eintragen."); const r = await api("POST", `/firma/${fid}/vertrag`, { ...d, unterlagen: unterl(d) }); toast(`Vertrag ${r.nummer} angelegt${r.status === "aktiv" ? " und aktiv" : " – aktiv, sobald alle Unterlagen da sind"}.`); neu(); });
    document.querySelectorAll("[data-unterlage],[data-onboarding]").forEach((cb) => cb.addEventListener("change", async () => {
      const [vid, k] = (cb.dataset.unterlage || cb.dataset.onboarding).split(":");
      try {
        const r = cb.dataset.unterlage ? await api("POST", `/vertrag/${vid}/unterlage`, { art: k, ja: cb.checked }) : await api("POST", `/vertrag/${vid}/onboarding`, { schritt: k, ja: cb.checked });
        if (cb.dataset.unterlage && r.vertrag.status === "aktiv" && !r.vertrag.unterlagen_fehlen.length) toast("Unterlagen vollständig – Vertrag ist aktiv.");
        else if (cb.dataset.onboarding && r.vertrag.onboarding_stand === "Live") toast("Kunde ist live.");
        neu();
      } catch (e) { cb.checked = !cb.checked; toast(e.message); }
    }));
    if ($("#einw")) beiAbsenden($("#einw"), async (d) => { await api("POST", `/firma/${fid}/einwilligung`, { ja: true, nachweis: d.nachweis }); toast("Einwilligung gespeichert."); neu(); });
    if ($("#einwWeg")) $("#einwWeg").addEventListener("click", async () => { if (!confirm("Einwilligung wirklich zurückziehen?")) return; await api("POST", `/firma/${fid}/einwilligung`, { ja: false }); neu(); });
    if ($("#infomail")) $("#infomail").addEventListener("click", async () => { if (!confirm("Info-Mail jetzt senden?")) return; try { await api("POST", `/firma/${fid}/infomail`, {}); toast("Info-Mail verschickt."); neu(); } catch (e) { toast(e.message); } });
    beiAbsenden($("#dok"), async (d, form) => {
      const datei = form.elements.datei.files[0]; if (!datei) throw new Error("Bitte eine Datei wählen.");
      if (datei.size > 10_000_000) throw new Error("Die Datei ist größer als 10 MB.");
      await api("POST", `/firma/${fid}/dokument`, datei, { "Content-Type": datei.type || "application/octet-stream", "x-name": encodeURIComponent(datei.name), "x-titel": encodeURIComponent(d.titel || datei.name), "x-typ": encodeURIComponent(d.typ) });
      toast("Hochgeladen."); neu();
    });
    document.querySelectorAll("[data-dokweg]").forEach((b) => b.addEventListener("click", async () => { if (confirm("Datei löschen?")) { await api("DELETE", "/dokument/" + b.dataset.dokweg); neu(); } }));
    document.querySelectorAll("[data-apweg]").forEach((b) => b.addEventListener("click", async () => { if (confirm("Ansprechpartner entfernen?")) { await api("DELETE", "/ansprechpartner/" + b.dataset.apweg); neu(); } }));
    document.querySelectorAll("form[data-kuendigen]").forEach((f) => beiAbsenden(f, async (d) => {
      if (!d.verlustgrund) throw new Error("Bitte einen Grund wählen.");
      await api("PUT", "/vertrag/" + f.dataset.kuendigen, { status: "gekuendigt", ende: d.ende, verlustgrund: d.verlustgrund }); toast("Kündigung gespeichert. Rückgewinnungsanruf steht als Aufgabe an."); neu();
    }));
    document.querySelectorAll("[data-beenden]").forEach((b) => b.addEventListener("click", async () => { if (confirm("Vertrag als beendet markieren?")) { await api("PUT", "/vertrag/" + b.dataset.beenden, { status: "beendet" }); neu(); } }));
    if ($("#bewerten")) $("#bewerten").addEventListener("click", async (e) => { e.target.disabled = true; e.target.textContent = "Liest Website …"; try { const r = await api("POST", `/firma/${fid}/bewerten`, {}); toast(`Bewertet: ${r.score} Punkte.`); neu(); } catch (err) { toast(err.message); e.target.disabled = false; } });
    if ($("#sperren")) $("#sperren").addEventListener("click", async () => { const g = prompt("Grund für die Sperre?", "Möchte nicht kontaktiert werden"); if (g === null) return; await api("POST", `/firma/${fid}/sperren`, { grund: g }); neu(); });
    if ($("#entsperren")) $("#entsperren").addEventListener("click", async () => { if (confirm("Sperre wirklich aufheben? Nur wenn die Firma selbst wieder Kontakt möchte.")) { await api("POST", `/firma/${fid}/entsperren`, {}); neu(); } });
    $("#loeschen").addEventListener("click", async () => { if (confirm("Firma mit allen Kontakten, Dateien, Angeboten, Verträgen und Zahlungen endgültig löschen? Für eine Sperrliste lieber „Sperren“.")) { await api("DELETE", `/firma/${fid}`); toast("Gelöscht."); location.hash = "#/firmen"; } });
  }
  if (name === "produkte") {
    const pf = $("#produkt"), box = $("#laufzeiten");
    const setzen = (p) => {
      const el = pf.elements; el.pid.value = p ? p.id : ""; el.name.value = p ? p.name : ""; el.leistung.value = p ? p.leistung || "" : ""; el.beschreibung.value = p ? p.beschreibung || "" : ""; el.aktiv.checked = p ? p.aktiv : true;
      box.innerHTML = (p ? p.laufzeiten : [{ monate: 0, frist_monate: 1 }, { monate: 12, frist_monate: 3 }, { monate: 24, frist_monate: 3 }]).map(laufzeitZeile).join("");
      $("#produktTitel").textContent = p ? "Produkt bearbeiten" : "Produkt anlegen";
    };
    setzen(null);
    box.addEventListener("click", (e) => { const b = e.target.closest("[data-lzweg]"); if (b) b.closest(".lz").remove(); });
    $("#lzNeu").addEventListener("click", () => box.insertAdjacentHTML("beforeend", laufzeitZeile({ monate: 12, frist_monate: 3 })));
    $("#produktNeu").addEventListener("click", () => setzen(null));
    document.querySelectorAll("[data-produkt]").forEach((b) => b.addEventListener("click", () => { setzen(ANSICHTEN._produktListe.find((p) => String(p.id) === b.dataset.produkt)); pf.scrollIntoView({ behavior: "smooth" }); }));
    beiAbsenden(pf, async (d) => {
      const laufzeiten = [...box.querySelectorAll(".lz")].map((z) => ({ id: z.dataset.id || undefined, monate: z.querySelector("[name=lz_monate]").value, frist_monate: z.querySelector("[name=lz_frist]").value, einmal: z.querySelector("[name=lz_einmal]").value, monatlich: z.querySelector("[name=lz_monat]").value }));
      await api("POST", "/produkte", { id: d.pid || undefined, name: d.name, leistung: d.leistung, beschreibung: d.beschreibung, aktiv: d.aktiv, laufzeiten }); toast("Gespeichert."); zeichnen();
    });
  }
  if (name === "leitfaeden") {
    document.querySelectorAll("form[data-leitfaden]").forEach((f) => beiAbsenden(f, async (d) => { await api("POST", "/leitfaeden", { ...d, id: f.dataset.leitfaden || undefined }); toast("Gespeichert."); zeichnen(); }));
    document.querySelectorAll("[data-lfweg]").forEach((b) => b.addEventListener("click", async () => { if (confirm("Leitfaden löschen?")) { await api("DELETE", "/leitfaden/" + b.dataset.lfweg); zeichnen(); } }));
  }
  if (name === "einstellungen") {
    beiAbsenden($("#einst"), async (d) => {
      d.zielbranchen = Object.keys(ICH.branchen).filter((k) => d["b_" + k]); for (const k of Object.keys(d)) if (k.startsWith("b_")) delete d[k];
      d.zielregionen = d.zielregionen.split("\n"); d.team = d.team.split("\n");
      await api("PUT", "/einstellungen", d); ICH = null; toast("Gespeichert.");
    });
    document.querySelectorAll("[data-bot]").forEach((b) => b.addEventListener("click", async () => {
      b.disabled = true; $("#botBericht").textContent = "Läuft …";
      try { const r = await api("POST", "/bot/jetzt", { suche: b.dataset.bot === "suche", impulse: b.dataset.bot === "impulse" }); $("#botBericht").textContent = JSON.stringify(r.bericht, null, 2); }
      catch (e) { $("#botBericht").textContent = e.message; } finally { b.disabled = false; }
    }));
  }
}

async function zeichnen() {
  const h = location.hash.replace(/^#\/?/, "") || "heute";
  const [pfad, qs] = h.split("?");
  const [name, idTeil] = pfad.split("/");
  const ansicht = ANSICHTEN[name] ? name : "heute";
  document.querySelectorAll("nav a").forEach((a) => { if (a.getAttribute("href") === "#/" + (ansicht === "firma" ? "firmen" : ansicht)) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  try {
    if (!ICH) { ICH = await api("GET", "/ich"); $("#nav").classList.remove("versteckt"); $("#abmelden").classList.remove("versteckt"); }
    const html = await ANSICHTEN[ansicht](new URLSearchParams(qs || ""), idTeil);
    $("#app").innerHTML = html;
    verdrahten(ansicht, idTeil, new URLSearchParams(qs || ""));
  } catch (e) { if (e.message !== "abgemeldet") { $("#app").innerHTML = `<p class="fehler">${esc(e.message)}</p>`; console.error(e); } }
}
window.addEventListener("hashchange", () => { zeichnen(); window.scrollTo(0, 0); });
zeichnen();
</script>
