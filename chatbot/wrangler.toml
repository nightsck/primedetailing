# Cloudflare Worker für den Website-Chat
name = "primedetailing-chat"
main = "src/worker.ts"
compatibility_date = "2026-06-01"
compatibility_flags = ["nodejs_compat"]
# Variablen, die im Cloudflare-Dashboard geändert werden (z. B. KILL_SWITCH),
# beim nächsten Deploy nicht überschreiben
keep_vars = true

# Öffentliche Einstellungen (Geheimnisse NICHT hier, sondern per `npx wrangler secret put …`)
[vars]
LLM_PROVIDER = "anthropic"
# dazu die Firmen-Website ki-für-meinen-betrieb.de (Punycode) für das Kontaktformular
ALLOWED_ORIGINS = "https://primedetailing.eu,https://www.primedetailing.eu,https://xn--ki-fr-meinen-betrieb-sec.de,https://www.xn--ki-fr-meinen-betrieb-sec.de,https://nightsck.github.io"
# Anfragen aus dem Chat: Web3Forms (Empfänger support@ im Web3Forms-Dashboard). Der Key ist öffentlich.
WEB3FORMS_KEY = "c7958793-0cd7-4107-9c71-becdc1ee3948"
# Notbremse: KILL_SWITCH = "1" pausiert den Chat sofort. Am einfachsten im
# Cloudflare-Dashboard setzen (Worker → Einstellungen → Variablen), siehe CLOUDFLARE.md.

# Geheimnisse (einmalig setzen):
#   npx wrangler secret put ANTHROPIC_API_KEY
#   npx wrangler secret put SESSION_SECRET      (beliebige lange Zufallszeichenkette)
#   npx wrangler secret put GOOGLE_SA_JSON      (optional: Termin-Bot mit Google Kalender, siehe CLOUDFLARE.md)
# Dazu die Kalender-ID als Variable TERMIN_KALENDER im Dashboard (bleibt dank keep_vars erhalten).

# Zähler für die Spam-Limits (Minute/Stunde/Tag pro Besucher + Tagesbudget).
# Läuft im kostenlosen Workers-Tarif.
[[durable_objects.bindings]]
name = "LIMITS"
class_name = "LimitZaehler"

# Bewerbungsunterlagen vom Bewerber-Chat (primedetailing.eu/jobs/), SQLite.
# Nicht abgeschickte Dateien werden nach 2 Tagen gelöscht, abgeschickte nach 6 Monaten.
[[durable_objects.bindings]]
name = "ABLAGE"
class_name = "UnterlagenAblage"

# Internes Vertriebs-CRM (/crm): eine SQLite-Datenbank für Firmen, Kontakte,
# Kundenakte, Verträge und Zahlungen. Getrennt von den Daten der Kunden-Bots.
[[durable_objects.bindings]]
name = "CRM"
class_name = "CrmDaten"

# Kunden-Bots: Konfiguration je Kunde, Anfragen, Bewerbungen, Unterlagen und
# Zahlen für die Auswertung (Admin-Panel unter /admin). Getrennt vom CRM.
[[durable_objects.bindings]]
name = "KUNDEN"
class_name = "KundenDaten"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimitZaehler"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UnterlagenAblage"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CrmDaten"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["KundenDaten"]

# Akquise-Bot des CRM: alle 10 Minuten ein kleiner Schritt (suchen, bewerten,
# Anruf-Impulse, Monatsposten). Im kostenlosen Tarif enthalten.
[triggers]
crons = ["*/10 * * * *"]

# Läuft nahe an der KI-Schnittstelle statt am zufälligen Cloudflare-Standort
# des Besuchers – schneller und vermeidet vereinzelte Ablehnungen durch den Anbieter.
[placement]
mode = "smart"

[observability]
enabled = true
