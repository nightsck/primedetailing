fragen:
  - frage: "Kommen Sie wirklich zu mir?"
    antwort: "Ja. Wir sind mobil in St. Georgen und Umgebung unterwegs und bereiten Ihr Fahrzeug dort auf, wo es steht – nach Absprache."
  - frage: "Mein Auto ist richtig dreckig. Kostet das mehr?"
    antwort: "Bei sehr starker Verschmutzung kann ein Zuschlag anfallen. Schicken Sie uns am besten vorab ein paar Fotos per WhatsApp, dann sagen wir Ihnen vorher, woran Sie sind."
  - frage: "Was ist im Leasingrückläufer-Paket besonders?"
    antwort: "Neben der kompletten Innen- und Außenaufbereitung dokumentieren wir den Zustand vorher und nachher in einem Protokoll. Das hilft bei der Rückgabe."
  - frage: "Gibt es Konditionen für Firmen und Fuhrparks?"
    antwort: "Ja. Für Geschäftskunden und regelmäßige Aufträge erstellen wir ein individuelles Angebot mit Rabatt."
  - frage: "Wie lange hält eine Keramikversiegelung?"
    antwort: "Bei unserer Keramikversiegelung rechnen wir mit einer Standzeit von 24 bis 36 Monaten. Eine Glanzpolitur allein hält etwa 3 bis 6 Monate."
